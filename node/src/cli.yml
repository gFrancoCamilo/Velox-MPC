name: replica
version: "1.0"
author: hermitsage <dth.bht@gmail.com>
about: MPC node
args:
    - config:
        short: c
        long: config
        help: the config file containing startup information
        takes_value: true
        required: true
    - debug:
        short: v
        multiple: true
        help: sets the verbosity level
    - ip:
        short: i
        long: ip
        help: A file containing all the ips for the other servers
        takes_value: true
    - protocol:
        short: p
        long: protocol
        help: Protocol to run
        takes_value: true
    - syncer:
        short: y
        long: syncer
        help: IPs for the syncer to connect to
        takes_value: true
    - messages:
        short: t
        long: messages
        help: (legacy, unused by the NN-inference protocol)
        takes_value: true
    - nn_x:
        long: nn_x
        help: Neurons in each of the first three layers of the network
        takes_value: true
    - nn_y:
        long: nn_y
        help: Neurons in the final layer of the network (nn_y <= nn_x)
        takes_value: true
    - nn_batch:
        long: nn_batch
        help: Number of inference inputs evaluated in one forward pass
        takes_value: true
    - weight_chunk:
        long: weight_chunk
        help: Secrets per ACSS instance when splitting a party's weight block
        takes_value: true
    - comp:
        short: o
        long: comp
        help: Compression factor for multiplication gate verification
        takes_value: true
    # - bfile:
    #     short: b
    #     long: bfile
    #     help: The location of a file containing the list of all messages to be reliably broadcasted
    #     takes_value: true
    - byz:
        short: b
        long: byzantine
        help: Byzantine faulty or normal node
        takes_value: true